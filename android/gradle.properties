org.gradle.jvmargs=-Xmx1536M -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3 -Dcom.sun.net.ssl.checkRevocation=false -Djdk.security.allowInsecureRenderer=true -Dtrust_all_cert=true

android.useAndroidX=true
android.enableJetifier=true

# SSL Certificate fix for Gradle downloads
org.gradle.internal.http.socketTimeout=300000
org.gradle.internal.http.connectionTimeout=300000
org.gradle.internal.http.maxRedirects=20
org.gradle.internal.http.ssl.disabledProtocols=SSLv2,SSLv3
