org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3 -Dcom.sun.net.ssl.checkRevocation=false -Djdk.security.allowInsecureRenderer=true -Dtrust_all_cert=true

android.useAndroidX=true
android.enableJetifier=true

# SSL Certificate fix for Gradle downloads
org.gradle.internal.http.socketTimeout=300000
org.gradle.internal.http.connectionTimeout=300000
org.gradle.internal.http.maxRedirects=20
org.gradle.internal.http.ssl.disabledProtocols=SSLv2,SSLv3
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
