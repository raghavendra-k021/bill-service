name: textile_billing_android
description: A comprehensive Android mobile billing application for textile shops
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Barcode Scanning
  mobile_scanner: ^3.5.0
  
  # Barcode Generation (for labels)
  barcode_widget: ^2.0.4
  barcode_image: ^2.0.3
  image: ^4.1.0
  
  # Shop logo (pick from gallery/camera)
  image_picker: ^1.0.7
  
  # Printing
  esc_pos_utils_plus: ^2.0.1
  flutter_blue_plus: ^1.30.0
  
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.12.0
  share_plus: ^10.0.2
  flutter_file_saver: ^0.9.0

  # Charts
  fl_chart: ^0.66.0
  
  # Excel Export
  excel: ^2.1.0
  
  # Cloud Backup
  google_sign_in: ^6.1.6
  googleapis: ^11.2.0
  googleapis_auth: ^1.4.1
  
  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  
  # Utilities
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  http: ^1.1.0
  
  # Biometric Authentication
  local_auth: ^2.1.7
  flutter_classic_bluetooth: ^1.0.0
  
  # Work Manager for scheduled tasks
  # Note: Temporarily removed due to compatibility issues with Flutter embedding v2
  # workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.14.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
